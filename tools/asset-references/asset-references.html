<!DOCTYPE html>
<html lang="en">
  <head>
    <title>DAM Asset References</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- Import DA App SDK -->
    <script src="https://da.live/nx/utils/sdk.js" type="module"></script>
    <!-- Project App Logic -->
    <script src="/tools/asset-references/asset-references.js" type="module"></script>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" type="text/css" href="/tools/asset-references/asset-references.css">
  </head>
  <body>
    <div class="app-container">
      <h2>DAM Asset References</h2>
      <p class="intro">
        Lists every asset in the DAM that Document Authoring content links to, how many
        documents link it, and which ones. Read only &mdash; nothing is written to DA or to AEM.
      </p>

      <div class="controls">
        <button id="scanButton" class="primary" type="button">Scan repository</button>
        <button id="csvButton" type="button" disabled>Export CSV</button>
        <button id="xlsxButton" type="button" disabled>Export Excel</button>
        <button id="folderButton" type="button" disabled aria-haspopup="dialog">
          Browse folders
        </button>
        <span id="folderCurrent" class="folder-current">All folders</span>
        <button id="folderClear" type="button" class="link-button" hidden>Clear</button>
      </div>

      <dialog id="folderModal" class="folder-modal">
        <form method="dialog" class="folder-modal-head">
          <h3>Filter by DAM folder</h3>
          <button type="submit" class="link-button" aria-label="Close">Close</button>
        </form>
        <div class="folder-tree" id="folderTree"></div>
      </dialog>

      <div class="status-message" role="status" aria-live="polite"></div>
      <div class="summary"></div>

      <div class="result-count"></div>

      <table class="results">
        <thead>
          <tr>
            <th>Asset</th>
            <th class="num">Documents</th>
            <th class="num">Published</th>
            <th>Locations</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </body>
</html>
